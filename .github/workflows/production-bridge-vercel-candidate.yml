name: Production Bridge Vercel Candidate
run-name: Production bridge candidate verify ${{ inputs.deployment_id }}

on:
  workflow_dispatch:
    inputs:
      release_sha:
        description: Exact current main SHA for the staged release
        required: true
        type: string
      deployment_id:
        description: Vercel staged Production deployment ID for the approved bridge commit
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: coco-production-bridge-vercel-candidate
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      TEAM_ID: team_P1Z1wvYF1h42LIl0YfgXoOPI
      PROJECT_ID: prj_AcjmJFO5jcqse6sStknZzZkmfR7h
      RELEASE_SHA: ${{ inputs.release_sha }}
      DEPLOYMENT_ID: ${{ inputs.deployment_id }}
      BRIDGE_SHA: 64d5ad3fbc4e09f87ba8a09fdd75a9f823bccda1
      PRODUCTION_ALIAS: x-clone-olive-chi.vercel.app

    steps:
      - name: Verify inputs and current release SHA
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          [ -n "${VERCEL_TOKEN:-}" ] || { echo "VERCEL_TOKEN is not configured."; exit 1; }
          [[ "${RELEASE_SHA}" =~ ^[0-9a-f]{40}$ ]] || { echo "release_sha must be a full Git SHA."; exit 1; }
          [[ "${DEPLOYMENT_ID}" =~ ^dpl_[A-Za-z0-9]+$ ]] || { echo "deployment_id must be a Vercel deployment ID."; exit 1; }
          main_sha="$(gh api "repos/${REPOSITORY}/branches/main" --jq '.commit.sha')"
          [ "${RELEASE_SHA}" = "${main_sha}" ] || { echo "release_sha does not match current main."; exit 1; }

      - name: Verify exact READY staged Production bridge deployment
        id: candidate
        shell: bash
        run: |
          set -euo pipefail

          details="$(curl --fail-with-body --silent --show-error             --request GET             --url "https://api.vercel.com/v13/deployments/${DEPLOYMENT_ID}?withGitRepoInfo=true&teamId=${TEAM_ID}"             --header "Accept: application/json"             --header "Authorization: Bearer ${VERCEL_TOKEN}")"

          actual_id="$(jq -r '.id // .uid // ""' <<<"${details}")"
          url="$(jq -r '.url // ""' <<<"${details}")"
          state="$(jq -r '.readyState // .state // ""' <<<"${details}")"
          target="$(jq -r '.target // ""' <<<"${details}")"
          bridge_meta="$(jq -r '.meta.cocoBridgeSha // ""' <<<"${details}")"
          release_meta="$(jq -r '.meta.cocoReleaseSha // ""' <<<"${details}")"
          build_guard="$(jq -r '.meta.cocoBuildGuard // ""' <<<"${details}")"
          alias_bound="$(jq -r --arg alias "${PRODUCTION_ALIAS}" '[(.alias // [])[] | select(. == $alias)] | length' <<<"${details}")"

          [ "${actual_id}" = "${DEPLOYMENT_ID}" ] || { echo "Deployment detail ID mismatch."; exit 1; }
          [ "${state}" = "READY" ] || { echo "Bridge deployment is not READY."; exit 1; }
          [ "${target}" = "production" ] || { echo "Bridge candidate must be a staged Production-target deployment."; exit 1; }
          [ -n "${url}" ] || { echo "Bridge deployment URL is missing."; exit 1; }
          [ "${bridge_meta}" = "${BRIDGE_SHA}" ] || { echo "Bridge SHA attestation mismatch."; exit 1; }
          [ "${release_meta}" = "${RELEASE_SHA}" ] || { echo "Release SHA attestation mismatch."; exit 1; }
          [ "${build_guard}" = "safe-no-migrate" ] || { echo "Safe bridge build guard attestation is missing."; exit 1; }
          [ "${alias_bound}" = "0" ] || { echo "Bridge candidate already owns the Production alias; candidate verification must happen before promotion."; exit 1; }

          echo "url=${url}" >> "${GITHUB_OUTPUT}"
          echo "target=${target}" >> "${GITHUB_OUTPUT}"

      - name: Emit bridge candidate summary
        shell: bash
        env:
          CANDIDATE_URL: ${{ steps.candidate.outputs.url }}
          CANDIDATE_TARGET: ${{ steps.candidate.outputs.target }}
        run: |
          {
            echo "## Production bridge Vercel candidate: PASS"
            echo
            echo "- staged release SHA: `${RELEASE_SHA}`"
            echo "- bridge SHA: `${BRIDGE_SHA}`"
            echo "- bridge deployment ID: `${DEPLOYMENT_ID}`"
            echo "- bridge deployment URL: `${CANDIDATE_URL}`"
            echo "- target: `${CANDIDATE_TARGET}`"
            echo "- build guard: `safe-no-migrate`"
            echo "- Production alias assigned: `no`"
            echo
            echo "This workflow is read-only and does not change Production traffic."
          } >> "${GITHUB_STEP_SUMMARY}"
