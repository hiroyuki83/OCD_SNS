name: Temporary Sharp Lockfile Generator

on:
  pull_request:
    branches:
      - main
    paths:
      - 'package.json'
      - '.github/workflows/temp-generate-sharp-lock.yml'

permissions:
  contents: write

jobs:
  generate-lock:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout PR head
        uses: actions/checkout@v6
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0

      - name: Use Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 20

      - name: Regenerate lockfile with npm
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund

      - name: Commit generated lockfile to PR branch
        shell: bash
        env:
          HEAD_REF: ${{ github.head_ref }}
        run: |
          set -euo pipefail
          if git diff --quiet -- package-lock.json package.json; then
            echo "Lockfile is already synchronized."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json
          git commit -m "build: synchronize package lock for sharp"
          git push origin "HEAD:${HEAD_REF}"
