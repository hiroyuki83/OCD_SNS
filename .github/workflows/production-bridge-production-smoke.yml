name: Production Bridge Production Smoke
run-name: Production bridge smoke ${{ inputs.deployment_id }}

on:
  workflow_dispatch:
    inputs:
      release_sha:
        description: Exact current main SHA for the staged release
        required: true
        type: string
      deployment_id:
        description: Bridge Vercel deployment ID expected to serve Production
        required: true
        type: string
      bridge_promotion_run_id:
        description: Successful Production Bridge Vercel Promote run ID
        required: true
        type: string

permissions:
  contents: read
  actions: read

concurrency:
  group: coco-production-bridge-production-smoke
  cancel-in-progress: true

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      TEAM_ID: team_P1Z1wvYF1h42LIl0YfgXoOPI
      RELEASE_SHA: ${{ inputs.release_sha }}
      DEPLOYMENT_ID: ${{ inputs.deployment_id }}
      BRIDGE_PROMOTION_RUN_ID: ${{ inputs.bridge_promotion_run_id }}
      PRODUCTION_BASE_URL: https://x-clone-olive-chi.vercel.app

    steps:
      - name: Verify bridge promotion attestation
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          [ -n "${VERCEL_TOKEN:-}" ] || { echo "VERCEL_TOKEN is not configured."; exit 1; }
          [[ "${RELEASE_SHA}" =~ ^[0-9a-f]{40}$ ]] || { echo "release_sha must be a full Git SHA."; exit 1; }
          [[ "${DEPLOYMENT_ID}" =~ ^dpl_[A-Za-z0-9]+$ ]] || { echo "deployment_id must be a Vercel deployment ID."; exit 1; }
          [[ "${BRIDGE_PROMOTION_RUN_ID}" =~ ^[0-9]+$ ]] || { echo "bridge promotion run ID must be numeric."; exit 1; }

          j="$(gh api "repos/${REPOSITORY}/actions/runs/${BRIDGE_PROMOTION_RUN_ID}")"
          [ "$(jq -r '.conclusion // ""' <<<"${j}")" = "success" ] || { echo "Bridge promotion did not succeed."; exit 1; }
          [ "$(jq -r '.head_sha // ""' <<<"${j}")" = "${RELEASE_SHA}" ] || { echo "Bridge promotion SHA mismatch."; exit 1; }
          [ "$(jq -r '.path // ""' <<<"${j}")" = ".github/workflows/production-bridge-vercel-promote.yml" ] || { echo "Bridge promotion workflow mismatch."; exit 1; }
          [ "$(jq -r '.display_title // ""' <<<"${j}")" = "Production bridge promote ${DEPLOYMENT_ID}" ] || { echo "Bridge promotion deployment mismatch."; exit 1; }

      - name: Verify Production alias is assigned to bridge deployment
        shell: bash
        run: |
          set -euo pipefail
          aliases="$(curl --fail-with-body --silent --show-error             --request GET             --url "https://api.vercel.com/v2/deployments/${DEPLOYMENT_ID}/aliases?teamId=${TEAM_ID}"             --header "Accept: application/json"             --header "Authorization: Bearer ${VERCEL_TOKEN}")"
          count="$(jq '[.aliases[] | select(.alias == "x-clone-olive-chi.vercel.app")] | length' <<<"${aliases}")"
          [ "${count}" -ge 1 ] || { echo "Production alias is not assigned to bridge deployment."; exit 1; }

      - name: Smoke bridge Production runtime
        shell: bash
        run: |
          set -euo pipefail
          for path in / /login /explore; do
            status="$(curl --silent --show-error --output /dev/null --write-out '%{http_code}' "${PRODUCTION_BASE_URL}${path}")"
            [ "${status}" = "200" ] || { echo "${path} returned HTTP ${status}."; exit 1; }
          done

          body="$(mktemp)"
          status="$(curl --silent --show-error --output "${body}" --write-out '%{http_code}' "${PRODUCTION_BASE_URL}/api/feed?limit=1")"
          [ "${status}" = "200" ] || { echo "Bridge feed returned HTTP ${status}."; cat "${body}"; exit 1; }
          node -e "JSON.parse(require('fs').readFileSync(process.argv[1], 'utf8'))" "${body}"

      - name: Repeat bridge Production smoke
        shell: bash
        run: |
          set -euo pipefail
          for attempt in 1 2 3; do
            curl --fail --silent --show-error "${PRODUCTION_BASE_URL}/" >/dev/null
            curl --fail --silent --show-error "${PRODUCTION_BASE_URL}/api/feed?limit=1" >/dev/null
            if [ "${attempt}" -lt 3 ]; then sleep 5; fi
          done

      - name: Emit bridge Production smoke summary
        shell: bash
        run: |
          {
            echo "## Production bridge smoke: PASS"
            echo
            echo "- bridge deployment ID: \`${DEPLOYMENT_ID}\`"
            echo "- Production alias: \`${PRODUCTION_BASE_URL}\`"
            echo "- public routes: ok"
            echo "- DB-backed feed: ok"
            echo "- repeated smoke: ok"
            echo
            echo "Stage C may proceed only with this successful smoke attestation."
          } >> "${GITHUB_STEP_SUMMARY}"
