name: CoCo Preview Environment Bootstrap

on:
  push:
    branches:
      - preview
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: coco-preview-environment-bootstrap
  cancel-in-progress: false

jobs:
  configure-preview:
    if: ${{ github.ref_name == 'preview' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: preview
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      NEON_API_KEY: ${{ secrets.NEON_API_KEY }}
      TEAM_ID: team_P1Z1wvYF1h42LIl0YfgXoOPI
      PROJECT_ID: prj_AcjmJFO5jcqse6sStknZzZkmfR7h
      PREVIEW_NEON_PROJECT_ID: plain-dawn-64792117
      PREVIEW_DATABASE_NAME: neondb
      PREVIEW_BRANCH: preview

    steps:
      - name: Verify required API secrets
        shell: bash
        run: |
          set -euo pipefail
          [ -n "${VERCEL_TOKEN:-}" ] || { echo "VERCEL_TOKEN is not configured."; exit 1; }
          [ -n "${NEON_API_KEY:-}" ] || { echo "NEON_API_KEY is not configured."; exit 1; }

      - name: Resolve Preview database URL from Neon without exposing it
        id: neon
        shell: bash
        run: |
          set -euo pipefail

          branches="$(curl --fail-with-body --silent --show-error \
            --request GET \
            --url "https://console.neon.tech/api/v2/projects/${PREVIEW_NEON_PROJECT_ID}/branches?limit=10000&include_deleted=false" \
            --header "Accept: application/json" \
            --header "Authorization: Bearer ${NEON_API_KEY}")"

          branch_id="$(jq -r '.branches[] | select(.default == true) | .id' <<<"${branches}" | head -n1)"
          branch_name="$(jq -r '.branches[] | select(.default == true) | .name' <<<"${branches}" | head -n1)"
          [ -n "${branch_id}" ] && [ "${branch_id}" != "null" ] || { echo "Preview default Neon branch could not be resolved."; exit 1; }

          roles="$(curl --fail-with-body --silent --show-error \
            --request GET \
            --url "https://console.neon.tech/api/v2/projects/${PREVIEW_NEON_PROJECT_ID}/branches/${branch_id}/roles" \
            --header "Accept: application/json" \
            --header "Authorization: Bearer ${NEON_API_KEY}")"

          role_name="$(jq -r '[.roles[]?.name | select(. != null)] | (map(select(endswith("_owner"))) + .) | .[0] // ""' <<<"${roles}")"
          [ -n "${role_name}" ] || { echo "Preview Neon role could not be resolved."; exit 1; }

          encoded_role="$(jq -rn --arg v "${role_name}" '$v|@uri')"
          encoded_db="$(jq -rn --arg v "${PREVIEW_DATABASE_NAME}" '$v|@uri')"
          connection="$(curl --fail-with-body --silent --show-error \
            --request GET \
            --url "https://console.neon.tech/api/v2/projects/${PREVIEW_NEON_PROJECT_ID}/connection_uri?branch_id=${branch_id}&database_name=${encoded_db}&role_name=${encoded_role}&pooled=true" \
            --header "Accept: application/json" \
            --header "Authorization: Bearer ${NEON_API_KEY}")"

          preview_database_url="$(jq -r '.uri // ""' <<<"${connection}")"
          [ -n "${preview_database_url}" ] || { echo "Preview Neon connection URI could not be resolved."; exit 1; }

          echo "::add-mask::${preview_database_url}"
          printf '%s' "${preview_database_url}" > /tmp/coco-preview-database-url
          echo "branch_id=${branch_id}" >> "${GITHUB_OUTPUT}"
          echo "branch_name=${branch_name}" >> "${GITHUB_OUTPUT}"
          echo "role_name=${role_name}" >> "${GITHUB_OUTPUT}"

      - name: Ensure branch-scoped Preview database URL
        shell: bash
        run: |
          set -euo pipefail
          preview_database_url="$(cat /tmp/coco-preview-database-url)"
          payload="$(jq -n \
            --arg value "${preview_database_url}" \
            --arg branch "${PREVIEW_BRANCH}" \
            '[{
              key: "PREVIEW_DATABASE_URL",
              value: $value,
              type: "sensitive",
              target: ["preview"],
              gitBranch: $branch,
              comment: "CoCo fixed Preview branch database"
            }]')"

          curl --fail-with-body --silent --show-error \
            --request POST \
            --url "https://api.vercel.com/v10/projects/${PROJECT_ID}/env?upsert=true&teamId=${TEAM_ID}" \
            --header "Authorization: Bearer ${VERCEL_TOKEN}" \
            --header "Content-Type: application/json" \
            --data "${payload}" >/tmp/preview-db-env-response.json

          jq -e '(.failed // []) | length == 0' /tmp/preview-db-env-response.json >/dev/null
          echo "Branch-scoped PREVIEW_DATABASE_URL is configured."

      - name: Ensure stable Preview staff MFA encryption key
        shell: bash
        run: |
          set -euo pipefail

          current="$(curl --fail-with-body --silent --show-error \
            --request GET \
            --url "https://api.vercel.com/v9/projects/${PROJECT_ID}/env?teamId=${TEAM_ID}" \
            --header "Authorization: Bearer ${VERCEL_TOKEN}")"

          existing_id="$(jq -r \
            --arg branch "${PREVIEW_BRANCH}" \
            '[.envs[]? | select(
              .key == "STAFF_MFA_ENCRYPTION_KEY" and
              .gitBranch == $branch and
              ((.target // []) | index("preview"))
            )][0].id // ""' <<<"${current}")"

          if [ -n "${existing_id}" ]; then
            echo "Branch-scoped STAFF_MFA_ENCRYPTION_KEY already exists; preserving it."
            exit 0
          fi

          mfa_key="$(openssl rand -base64 32 | tr -d '\n')"
          payload="$(jq -n \
            --arg value "${mfa_key}" \
            --arg branch "${PREVIEW_BRANCH}" \
            '[{
              key: "STAFF_MFA_ENCRYPTION_KEY",
              value: $value,
              type: "sensitive",
              target: ["preview"],
              gitBranch: $branch,
              comment: "Stable CoCo Preview staff TOTP encryption key"
            }]')"

          curl --fail-with-body --silent --show-error \
            --request POST \
            --url "https://api.vercel.com/v10/projects/${PROJECT_ID}/env?upsert=true&teamId=${TEAM_ID}" \
            --header "Authorization: Bearer ${VERCEL_TOKEN}" \
            --header "Content-Type: application/json" \
            --data "${payload}" >/tmp/preview-mfa-env-response.json

          jq -e '(.failed // []) | length == 0' /tmp/preview-mfa-env-response.json >/dev/null
          unset mfa_key
          echo "Branch-scoped STAFF_MFA_ENCRYPTION_KEY created without exposing its value."

      - name: Emit Preview environment summary
        shell: bash
        env:
          NEON_BRANCH_ID: ${{ steps.neon.outputs.branch_id }}
          NEON_BRANCH_NAME: ${{ steps.neon.outputs.branch_name }}
        run: |
          rm -f /tmp/coco-preview-database-url
          {
            echo "## CoCo fixed Preview environment"
            echo
            echo "- Git branch: `preview`"
            echo "- Vercel target: `preview`"
            echo "- Neon project: `${PREVIEW_NEON_PROJECT_ID}`"
            echo "- Neon branch: `${NEON_BRANCH_NAME}` (`${NEON_BRANCH_ID}`)"
            echo "- Preview DB variable: branch-scoped and configured"
            echo "- staff MFA encryption key: present and preserved across runs"
            echo "- secret values: not printed"
          } >> "${GITHUB_STEP_SUMMARY}"
