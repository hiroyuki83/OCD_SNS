name: Production Rollback Acceptance
run-name: Production rollback acceptance ${{ inputs.rollback_deployment_id }}

on:
  workflow_dispatch:
    inputs:
      release_sha:
        description: Exact current-main release SHA that was rolled back at the app layer
        required: true
        type: string
      rollback_deployment_id:
        description: Approved bridge deployment ID now serving Production
        required: true
        type: string
      rollback_run_id:
        description: Successful Production Vercel Rollback run ID
        required: true
        type: string
      rollback_smoke_run_id:
        description: Successful Production Bridge Rollback Smoke run ID
        required: true
        type: string
      observation_minutes:
        description: Runtime log window in minutes
        required: true
        default: '10'
        type: string

permissions:
  contents: read
  actions: read

concurrency:
  group: coco-production-rollback-acceptance
  cancel-in-progress: true

jobs:
  accept-rollback:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ORG_ID: team_P1Z1wvYF1h42LIl0YfgXoOPI
      VERCEL_PROJECT_ID: prj_AcjmJFO5jcqse6sStknZzZkmfR7h
      VERCEL_TEAM_SLUG: hiroyuki-desperado-yahoocojps-projects
      RELEASE_SHA: ${{ inputs.release_sha }}
      ROLLBACK_DEPLOYMENT_ID: ${{ inputs.rollback_deployment_id }}
      ROLLBACK_RUN_ID: ${{ inputs.rollback_run_id }}
      ROLLBACK_SMOKE_RUN_ID: ${{ inputs.rollback_smoke_run_id }}
      OBSERVATION_MINUTES: ${{ inputs.observation_minutes }}
      BRIDGE_SHA: 64d5ad3fbc4e09f87ba8a09fdd75a9f823bccda1
      PRODUCTION_ALIAS: x-clone-olive-chi.vercel.app

    steps:
      - name: Verify rollback acceptance inputs
        shell: bash
        run: |
          set -euo pipefail
          [ -n "${VERCEL_TOKEN:-}" ] || { echo "VERCEL_TOKEN is not configured."; exit 1; }
          [[ "${RELEASE_SHA}" =~ ^[0-9a-f]{40}$ ]] || { echo "release_sha must be a full Git SHA."; exit 1; }
          [[ "${ROLLBACK_DEPLOYMENT_ID}" =~ ^dpl_[A-Za-z0-9]+$ ]] || { echo "rollback_deployment_id must be a Vercel deployment ID."; exit 1; }
          [[ "${ROLLBACK_RUN_ID}" =~ ^[0-9]+$ ]] || { echo "rollback_run_id must be numeric."; exit 1; }
          [[ "${ROLLBACK_SMOKE_RUN_ID}" =~ ^[0-9]+$ ]] || { echo "rollback_smoke_run_id must be numeric."; exit 1; }
          [[ "${OBSERVATION_MINUTES}" =~ ^[0-9]+$ ]] || { echo "observation_minutes must be numeric."; exit 1; }
          [ "${OBSERVATION_MINUTES}" -ge 5 ] || { echo "observation_minutes must be at least 5."; exit 1; }
          [ "${OBSERVATION_MINUTES}" -le 60 ] || { echo "observation_minutes cannot exceed 60."; exit 1; }

      - name: Verify rollback and smoke attestations
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail

          rollback="$(gh api "repos/${REPOSITORY}/actions/runs/${ROLLBACK_RUN_ID}")"
          [ "$(jq -r '.conclusion // ""' <<<"${rollback}")" = "success" ] || { echo "Rollback run did not succeed."; exit 1; }
          [ "$(jq -r '.head_sha // ""' <<<"${rollback}")" = "${RELEASE_SHA}" ] || { echo "Rollback run SHA mismatch."; exit 1; }
          [ "$(jq -r '.path // ""' <<<"${rollback}")" = ".github/workflows/production-vercel-rollback.yml" ] || { echo "Rollback workflow mismatch."; exit 1; }
          [ "$(jq -r '.display_title // ""' <<<"${rollback}")" = "Production rollback to ${ROLLBACK_DEPLOYMENT_ID}" ] || { echo "Rollback deployment ID mismatch."; exit 1; }

          smoke="$(gh api "repos/${REPOSITORY}/actions/runs/${ROLLBACK_SMOKE_RUN_ID}")"
          [ "$(jq -r '.conclusion // ""' <<<"${smoke}")" = "success" ] || { echo "Rollback smoke did not succeed."; exit 1; }
          [ "$(jq -r '.head_sha // ""' <<<"${smoke}")" = "${RELEASE_SHA}" ] || { echo "Rollback smoke SHA mismatch."; exit 1; }
          [ "$(jq -r '.path // ""' <<<"${smoke}")" = ".github/workflows/production-bridge-rollback-smoke.yml" ] || { echo "Rollback smoke workflow mismatch."; exit 1; }

      - name: Verify exact bridge deployment remains READY
        id: deployment
        shell: bash
        run: |
          set -euo pipefail

          details="$(curl --fail-with-body --silent --show-error             --request GET             --url "https://api.vercel.com/v13/deployments/${ROLLBACK_DEPLOYMENT_ID}?withGitRepoInfo=true&teamId=${VERCEL_ORG_ID}"             --header "Accept: application/json"             --header "Authorization: Bearer ${VERCEL_TOKEN}")"

          actual_id="$(jq -r '.id // .uid // ""' <<<"${details}")"
          actual_url="$(jq -r '.url // ""' <<<"${details}")"
          actual_state="$(jq -r '.readyState // .state // ""' <<<"${details}")"
          actual_sha="$(jq -r '.meta.githubCommitSha // .gitSource.sha // ""' <<<"${details}")"

          [ "${actual_id}" = "${ROLLBACK_DEPLOYMENT_ID}" ] || { echo "Rollback deployment ID mismatch."; exit 1; }
          [ "${actual_state}" = "READY" ] || { echo "Rollback deployment is not READY."; exit 1; }
          [ -n "${actual_url}" ] || { echo "Rollback deployment URL is missing."; exit 1; }
          if [ -n "${actual_sha}" ]; then
            [ "${actual_sha}" = "${BRIDGE_SHA}" ] || { echo "Rollback deployment is not the approved bridge SHA."; exit 1; }
          fi

          echo "url=${actual_url}" >> "${GITHUB_OUTPUT}"

      - name: Verify Production alias remains on bridge deployment
        shell: bash
        run: |
          set -euo pipefail

          aliases="$(curl --fail-with-body --silent --show-error             --request GET             --url "https://api.vercel.com/v2/deployments/${ROLLBACK_DEPLOYMENT_ID}/aliases?teamId=${VERCEL_ORG_ID}"             --header "Accept: application/json"             --header "Authorization: Bearer ${VERCEL_TOKEN}")"

          count="$(jq --arg alias "${PRODUCTION_ALIAS}" '[.aliases[] | select(.alias == $alias)] | length' <<<"${aliases}")"
          [ "${count}" -ge 1 ] || { echo "Production alias is no longer assigned to the rollback bridge deployment."; exit 1; }

      - name: Link Vercel CLI to confirmed project
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .vercel
          jq -n             --arg orgId "${VERCEL_ORG_ID}"             --arg projectId "${VERCEL_PROJECT_ID}"             '{orgId:$orgId, projectId:$projectId}' > .vercel/project.json

      - name: Scan bridge deployment for recent 5xx responses
        id: five_xx
        shell: bash
        env:
          DEPLOYMENT_URL: ${{ steps.deployment.outputs.url }}
        run: |
          set -euo pipefail

          log_file="$(mktemp)"
          npx --yes vercel@59.19.1 logs             --deployment "https://${DEPLOYMENT_URL}"             --status-code 5xx             --since "${OBSERVATION_MINUTES}m"             --json             --token "${VERCEL_TOKEN}"             --scope "${VERCEL_TEAM_SLUG}" >"${log_file}"

          count="$(node - "${log_file}" <<'NODE'
          const fs = require('node:fs');
          const path = process.argv[2];
          const lines = fs.readFileSync(path, 'utf8').split(/\r?\n/).filter((line) => line.trim());
          for (const line of lines) JSON.parse(line);
          process.stdout.write(String(lines.length));
          NODE
          )"

          echo "count=${count}" >> "${GITHUB_OUTPUT}"
          if [ "${count}" -gt 0 ]; then
            echo "Detected ${count} 5xx runtime log entries after rollback."
            cat "${log_file}"
            exit 1
          fi

      - name: Scan bridge deployment for application error logs
        id: errors
        shell: bash
        env:
          DEPLOYMENT_URL: ${{ steps.deployment.outputs.url }}
        run: |
          set -euo pipefail

          log_file="$(mktemp)"
          npx --yes vercel@59.19.1 logs             --deployment "https://${DEPLOYMENT_URL}"             --level error             --since "${OBSERVATION_MINUTES}m"             --json             --token "${VERCEL_TOKEN}"             --scope "${VERCEL_TEAM_SLUG}" >"${log_file}"

          count="$(node - "${log_file}" <<'NODE'
          const fs = require('node:fs');
          const path = process.argv[2];
          const lines = fs.readFileSync(path, 'utf8').split(/\r?\n/).filter((line) => line.trim());
          for (const line of lines) JSON.parse(line);
          process.stdout.write(String(lines.length));
          NODE
          )"

          echo "count=${count}" >> "${GITHUB_OUTPUT}"
          if [ "${count}" -gt 0 ]; then
            echo "::warning::Detected ${count} application error log entries after rollback. Review them even though the 5xx gate is clear."
            cat "${log_file}"
          fi

      - name: Emit rollback acceptance summary
        shell: bash
        env:
          DEPLOYMENT_URL: ${{ steps.deployment.outputs.url }}
          FIVE_XX_COUNT: ${{ steps.five_xx.outputs.count }}
          ERROR_COUNT: ${{ steps.errors.outputs.count }}
        run: |
          {
            echo "## Production rollback acceptance: PASS"
            echo
            echo "- rolled-back release SHA: \`${RELEASE_SHA}\`"
            echo "- approved bridge SHA: \`${BRIDGE_SHA}\`"
            echo "- rollback deployment ID: \`${ROLLBACK_DEPLOYMENT_ID}\`"
            echo "- rollback deployment URL: \`${DEPLOYMENT_URL}\`"
            echo "- Production alias: \`${PRODUCTION_ALIAS}\`"
            echo "- rollback smoke: verified"
            echo "- observation window: \`${OBSERVATION_MINUTES} minutes\`"
            echo "- 5xx runtime log entries: \`${FIVE_XX_COUNT}\`"
            echo "- application error log entries: \`${ERROR_COUNT}\`"
            echo
            echo "Rollback acceptance requires zero 5xx entries for the exact bridge deployment."
            echo "The database remains on the post-Stage-C schema."
          } >> "${GITHUB_STEP_SUMMARY}"
