name: Production Current Main Vercel Production Stage
run-name: Production current-main production stage ${{ inputs.release_sha }}

on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: Type STAGE_COCO_FINAL_PRODUCTION
        required: true
        type: string
      release_sha:
        description: Exact current protected main commit SHA to stage for Production
        required: true
        type: string

permissions:
  contents: read
  actions: read

concurrency:
  group: coco-production-current-main-production-stage
  cancel-in-progress: false

jobs:
  stage-production:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ORG_ID: team_P1Z1wvYF1h42LIl0YfgXoOPI
      VERCEL_PROJECT_ID: prj_AcjmJFO5jcqse6sStknZzZkmfR7h
      TEAM_ID: team_P1Z1wvYF1h42LIl0YfgXoOPI
      PROJECT_ID: prj_AcjmJFO5jcqse6sStknZzZkmfR7h
      RELEASE_SHA: ${{ inputs.release_sha }}
      PRODUCTION_ALIAS: x-clone-olive-chi.vercel.app

    steps:
      - name: Verify explicit staging input and exact current main
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          CONFIRMATION: ${{ inputs.confirmation }}
        run: |
          set -euo pipefail
          [ "${CONFIRMATION}" = "STAGE_COCO_FINAL_PRODUCTION" ] || {
            echo "Exact final Production staging confirmation is required."
            exit 1
          }
          [ -n "${VERCEL_TOKEN:-}" ] || { echo "VERCEL_TOKEN is not configured."; exit 1; }
          [[ "${RELEASE_SHA}" =~ ^[0-9a-f]{40}$ ]] || { echo "release_sha must be a full Git SHA."; exit 1; }

          main_sha="$(gh api "repos/${REPOSITORY}/branches/main" --jq '.commit.sha')"
          [ "${RELEASE_SHA}" = "${main_sha}" ] || {
            echo "release_sha does not match current main."
            echo "release_sha=${RELEASE_SHA}"
            echo "main_sha=${main_sha}"
            exit 1
          }

      - name: Checkout exact current main source
        uses: actions/checkout@v6
        with:
          ref: ${{ inputs.release_sha }}
          fetch-depth: 1

      - name: Verify checked out source and no migration build hook
        shell: bash
        run: |
          set -euo pipefail
          actual="$(git rev-parse HEAD)"
          [ "${actual}" = "${RELEASE_SHA}" ] || {
            echo "Checked-out SHA mismatch."
            exit 1
          }

          if grep -Eq 'prisma[[:space:]].*migrate[[:space:]].*deploy' scripts/vercel-build.mjs; then
            echo "Refusing staging because current-main Vercel build contains prisma migrate deploy."
            exit 1
          fi

          echo "Current-main Production stage contains no prisma migrate deploy hook."

      - name: Create staged Production deployment without Production alias
        id: deploy
        shell: bash
        env:
          STAGE_RUN_ID: ${{ github.run_id }}
        run: |
          set -euo pipefail

          npx --yes vercel@latest deploy             --prod             --skip-domain             --yes             --token="${VERCEL_TOKEN}"             --meta "cocoFinalReleaseSha=${RELEASE_SHA}"             --meta "cocoFinalBuildGuard=no-migrate"             --meta "cocoFinalStageRunId=${STAGE_RUN_ID}"             2>&1 | tee /tmp/coco-final-production-stage.log

          candidate=""
          for attempt in {1..30}; do
            response="$(curl --fail-with-body --silent --show-error               --request GET               --url "https://api.vercel.com/v7/deployments?projectId=${PROJECT_ID}&teamId=${TEAM_ID}&target=production&state=READY&limit=100"               --header "Accept: application/json"               --header "Authorization: Bearer ${VERCEL_TOKEN}")"

            candidate="$(jq -c               --arg release "${RELEASE_SHA}"               --arg run "${STAGE_RUN_ID}"               '[.deployments[] | select(
                (.meta.githubCommitSha // "") == $release and
                (.meta.cocoFinalReleaseSha // "") == $release and
                (.meta.cocoFinalBuildGuard // "") == "no-migrate" and
                (.meta.cocoFinalStageRunId // "") == $run
              )] | sort_by(.created // .createdAt // 0) | last // empty' <<<"${response}")"

            if [ -n "${candidate}" ]; then
              break
            fi
            sleep 2
          done

          [ -n "${candidate:-}" ] || {
            echo "Staged current-main Production deployment could not be resolved."
            exit 1
          }

          deployment_id="$(jq -r '.uid // .id // ""' <<<"${candidate}")"
          deployment_url="$(jq -r '.url // ""' <<<"${candidate}")"
          target="$(jq -r '.target // ""' <<<"${candidate}")"

          [[ "${deployment_id}" =~ ^dpl_[A-Za-z0-9]+$ ]] || { echo "Invalid staged deployment ID."; exit 1; }
          [ -n "${deployment_url}" ] || { echo "Staged deployment URL is missing."; exit 1; }
          [ "${target}" = "production" ] || { echo "Staged deployment is not Production-target."; exit 1; }

          details="$(curl --fail-with-body --silent --show-error             --request GET             --url "https://api.vercel.com/v13/deployments/${deployment_id}?withGitRepoInfo=true&teamId=${TEAM_ID}"             --header "Accept: application/json"             --header "Authorization: Bearer ${VERCEL_TOKEN}")"

          state="$(jq -r '.readyState // .state // ""' <<<"${details}")"
          alias_bound="$(jq -r --arg alias "${PRODUCTION_ALIAS}" '[(.alias // [])[] | select(. == $alias)] | length' <<<"${details}")"

          [ "${state}" = "READY" ] || { echo "Staged deployment is not READY."; exit 1; }
          [ "${alias_bound}" = "0" ] || {
            echo "Production alias was unexpectedly assigned during staging."
            exit 1
          }

          echo "deployment_id=${deployment_id}" >> "${GITHUB_OUTPUT}"
          echo "deployment_url=${deployment_url}" >> "${GITHUB_OUTPUT}"

      - name: Emit staged Production summary
        shell: bash
        env:
          DEPLOYMENT_ID: ${{ steps.deploy.outputs.deployment_id }}
          DEPLOYMENT_URL: ${{ steps.deploy.outputs.deployment_url }}
        run: |
          {
            echo "## Current-main Production staged deployment: READY"
            echo
            echo "- release SHA: \`${RELEASE_SHA}\`"
            echo "- deployment ID: \`${DEPLOYMENT_ID}\`"
            echo "- deployment URL: \`${DEPLOYMENT_URL}\`"
            echo "- target: \`production\`"
            echo "- build guard: \`no-migrate\`"
            echo "- canonical Production alias assigned: \`no\`"
            echo
            echo "This creates a Production-target staged deployment but does not move the canonical Production alias."
          } >> "${GITHUB_STEP_SUMMARY}"
