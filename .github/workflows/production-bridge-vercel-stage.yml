name: Production Current Main Vercel Preview Stage
run-name: Production current-main preview stage ${{ inputs.release_sha }}

on:
  workflow_dispatch:
    inputs:
      release_sha:
        description: Exact current protected main commit SHA to build as Preview candidate
        required: true
        type: string

permissions:
  contents: read
  actions: read

concurrency:
  group: coco-production-current-main-preview-stage
  cancel-in-progress: false

jobs:
  stage-preview:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ORG_ID: team_P1Z1wvYF1h42LIl0YfgXoOPI
      VERCEL_PROJECT_ID: prj_AcjmJFO5jcqse6sStknZzZkmfR7h
      TEAM_ID: team_P1Z1wvYF1h42LIl0YfgXoOPI
      PROJECT_ID: prj_AcjmJFO5jcqse6sStknZzZkmfR7h
      RELEASE_SHA: ${{ inputs.release_sha }}

    steps:
      - name: Verify exact current main release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          [ -n "${VERCEL_TOKEN:-}" ] || { echo "VERCEL_TOKEN is not configured."; exit 1; }
          [[ "${RELEASE_SHA}" =~ ^[0-9a-f]{40}$ ]] || { echo "release_sha must be a full Git SHA."; exit 1; }
          main_sha="$(gh api "repos/${REPOSITORY}/branches/main" --jq '.commit.sha')"
          [ "${RELEASE_SHA}" = "${main_sha}" ] || {
            echo "release_sha does not match current main."
            echo "release_sha=${RELEASE_SHA}"
            echo "main_sha=${main_sha}"
            exit 1
          }

      - name: Checkout exact current main source
        uses: actions/checkout@v6
        with:
          ref: ${{ inputs.release_sha }}
          fetch-depth: 1

      - name: Verify checked out source and safe build hook
        shell: bash
        run: |
          set -euo pipefail
          actual="$(git rev-parse HEAD)"
          [ "${actual}" = "${RELEASE_SHA}" ] || {
            echo "Checked-out SHA mismatch."
            exit 1
          }
          if grep -Eq 'prisma[[:space:]].*migrate[[:space:]].*deploy' scripts/vercel-build.mjs; then
            echo "Unexpected database migration hook found in current-main Vercel build."
            exit 1
          fi
          echo "Current-main Preview build contains no prisma migrate deploy hook."

      - name: Create exact current-main Preview deployment
        id: deploy
        shell: bash
        env:
          STAGE_RUN_ID: ${{ github.run_id }}
        run: |
          set -euo pipefail

          npx --yes vercel@latest deploy             --yes             --token="${VERCEL_TOKEN}"             --meta "cocoReleaseSha=${RELEASE_SHA}"             --meta "cocoCandidateKind=current-main-preview"             --meta "cocoCandidateStageRunId=${STAGE_RUN_ID}"             2>&1 | tee /tmp/coco-current-main-preview.log

          candidate=""
          for attempt in {1..30}; do
            response="$(curl --fail-with-body --silent --show-error               --request GET               --url "https://api.vercel.com/v7/deployments?projectId=${PROJECT_ID}&teamId=${TEAM_ID}&sha=${RELEASE_SHA}&state=READY&limit=100"               --header "Accept: application/json"               --header "Authorization: Bearer ${VERCEL_TOKEN}")"

            candidate="$(jq -c               --arg release "${RELEASE_SHA}"               --arg run "${STAGE_RUN_ID}"               '[.deployments[] | select(
                (.target // "") != "production" and
                (.meta.githubCommitSha // "") == $release and
                (.meta.cocoReleaseSha // "") == $release and
                (.meta.cocoCandidateKind // "") == "current-main-preview" and
                (.meta.cocoCandidateStageRunId // "") == $run
              )] | sort_by(.created // .createdAt // 0) | last // empty' <<<"${response}")"

            if [ -n "${candidate}" ]; then
              break
            fi
            sleep 2
          done

          [ -n "${candidate:-}" ] || {
            echo "Exact current-main READY Preview deployment could not be resolved."
            exit 1
          }

          deployment_id="$(jq -r '.uid // .id // ""' <<<"${candidate}")"
          deployment_url="$(jq -r '.url // ""' <<<"${candidate}")"
          target="$(jq -r '.target // ""' <<<"${candidate}")"

          [[ "${deployment_id}" =~ ^dpl_[A-Za-z0-9]+$ ]] || { echo "Invalid Preview deployment ID."; exit 1; }
          [ -n "${deployment_url}" ] || { echo "Preview deployment URL is missing."; exit 1; }
          [ "${target}" != "production" ] || { echo "Preview candidate unexpectedly targets Production."; exit 1; }

          echo "deployment_id=${deployment_id}" >> "${GITHUB_OUTPUT}"
          echo "deployment_url=${deployment_url}" >> "${GITHUB_OUTPUT}"

      - name: Emit Preview candidate summary
        shell: bash
        env:
          DEPLOYMENT_ID: ${{ steps.deploy.outputs.deployment_id }}
          DEPLOYMENT_URL: ${{ steps.deploy.outputs.deployment_url }}
        run: |
          {
            echo "## Current-main Vercel Preview candidate: READY"
            echo
            echo "- release SHA: \`${RELEASE_SHA}\`"
            echo "- deployment ID: \`${DEPLOYMENT_ID}\`"
            echo "- deployment URL: \`${DEPLOYMENT_URL}\`"
            echo "- target: \`preview\`"
            echo
            echo "This workflow creates only a Preview candidate. It does not modify Production traffic or the Production database."
          } >> "${GITHUB_STEP_SUMMARY}"
