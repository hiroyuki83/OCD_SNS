name: Production Vercel Rollback
run-name: Production rollback to ${{ inputs.rollback_deployment_id }}

on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: Type ROLLBACK_COCO_TO_BRIDGE
        required: true
        type: string
      release_sha:
        description: Exact current main SHA being rolled back at the app layer
        required: true
        type: string
      promotion_run_id:
        description: Successful Production Vercel Promote run ID for the current release
        required: true
        type: string
      rollback_deployment_id:
        description: Verified Vercel deployment ID for the approved bridge
        required: true
        type: string
      rollback_candidate_run_id:
        description: Successful Production Vercel Rollback Candidate Verification run ID
        required: true
        type: string
      bridge_rollback_validation_run_id:
        description: Successful Production Bridge Rollback Compatibility run ID
        required: true
        type: string

permissions:
  contents: read
  actions: read

concurrency:
  group: coco-production-vercel-rollback
  cancel-in-progress: false

jobs:
  rollback:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      TEAM_ID: team_P1Z1wvYF1h42LIl0YfgXoOPI
      PROJECT_ID: prj_AcjmJFO5jcqse6sStknZzZkmfR7h
      CONFIRMATION: ${{ inputs.confirmation }}
      RELEASE_SHA: ${{ inputs.release_sha }}
      PROMOTION_RUN_ID: ${{ inputs.promotion_run_id }}
      ROLLBACK_DEPLOYMENT_ID: ${{ inputs.rollback_deployment_id }}
      ROLLBACK_CANDIDATE_RUN_ID: ${{ inputs.rollback_candidate_run_id }}
      BRIDGE_ROLLBACK_VALIDATION_RUN_ID: ${{ inputs.bridge_rollback_validation_run_id }}
      BRIDGE_SHA: 64d5ad3fbc4e09f87ba8a09fdd75a9f823bccda1

    steps:
      - name: Verify explicit rollback inputs
        shell: bash
        run: |
          set -euo pipefail
          [ "${CONFIRMATION}" = "ROLLBACK_COCO_TO_BRIDGE" ] || { echo "Exact rollback confirmation is required."; exit 1; }
          [ -n "${VERCEL_TOKEN:-}" ] || { echo "VERCEL_TOKEN is not configured."; exit 1; }
          [[ "${RELEASE_SHA}" =~ ^[0-9a-f]{40}$ ]] || { echo "release_sha must be a full Git SHA."; exit 1; }
          [[ "${ROLLBACK_DEPLOYMENT_ID}" =~ ^dpl_[A-Za-z0-9]+$ ]] || { echo "rollback deployment ID is invalid."; exit 1; }
          for id in "${PROMOTION_RUN_ID}" "${ROLLBACK_CANDIDATE_RUN_ID}" "${BRIDGE_ROLLBACK_VALIDATION_RUN_ID}"; do
            [[ "${id}" =~ ^[0-9]+$ ]] || { echo "All attestation run IDs must be numeric."; exit 1; }
          done

      - name: Verify current main SHA
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          main_sha="$(gh api "repos/${REPOSITORY}/branches/main" --jq '.commit.sha')"
          [ "${RELEASE_SHA}" = "${main_sha}" ] || { echo "release_sha does not match current main."; exit 1; }

      - name: Verify rollback attestations
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail

          promotion="$(gh api "repos/${REPOSITORY}/actions/runs/${PROMOTION_RUN_ID}")"
          [ "$(jq -r '.conclusion // ""' <<<"${promotion}")" = "success" ] || { echo "Promotion run did not succeed."; exit 1; }
          [ "$(jq -r '.head_sha // ""' <<<"${promotion}")" = "${RELEASE_SHA}" ] || { echo "Promotion run SHA mismatch."; exit 1; }
          [ "$(jq -r '.path // ""' <<<"${promotion}")" = ".github/workflows/production-vercel-promote.yml" ] || { echo "Promotion workflow mismatch."; exit 1; }

          candidate="$(gh api "repos/${REPOSITORY}/actions/runs/${ROLLBACK_CANDIDATE_RUN_ID}")"
          [ "$(jq -r '.conclusion // ""' <<<"${candidate}")" = "success" ] || { echo "Rollback candidate verification did not succeed."; exit 1; }
          [ "$(jq -r '.head_sha // ""' <<<"${candidate}")" = "${RELEASE_SHA}" ] || { echo "Rollback candidate verification SHA mismatch."; exit 1; }
          [ "$(jq -r '.path // ""' <<<"${candidate}")" = ".github/workflows/production-vercel-rollback-candidate.yml" ] || { echo "Rollback candidate workflow mismatch."; exit 1; }
          [ "$(jq -r '.display_title // ""' <<<"${candidate}")" = "Production rollback candidate verify ${ROLLBACK_DEPLOYMENT_ID}" ] || { echo "Rollback candidate deployment ID mismatch."; exit 1; }

          compatibility="$(gh api "repos/${REPOSITORY}/actions/runs/${BRIDGE_ROLLBACK_VALIDATION_RUN_ID}")"
          [ "$(jq -r '.conclusion // ""' <<<"${compatibility}")" = "success" ] || { echo "Bridge rollback compatibility run did not succeed."; exit 1; }
          [ "$(jq -r '.head_sha // ""' <<<"${compatibility}")" = "${RELEASE_SHA}" ] || { echo "Bridge rollback compatibility SHA mismatch."; exit 1; }
          [ "$(jq -r '.path // ""' <<<"${compatibility}")" = ".github/workflows/production-bridge-rollback-validation.yml" ] || { echo "Bridge rollback compatibility workflow mismatch."; exit 1; }

      - name: Re-verify bridge deployment before rollback
        shell: bash
        run: |
          set -euo pipefail

          response="$(curl --fail-with-body --silent --show-error             --request GET             --url "https://api.vercel.com/v7/deployments?projectId=${PROJECT_ID}&teamId=${TEAM_ID}&sha=${BRIDGE_SHA}&state=READY&limit=100"             --header "Accept: application/json"             --header "Authorization: Bearer ${VERCEL_TOKEN}")"

          candidate="$(jq -c --arg id "${ROLLBACK_DEPLOYMENT_ID}" '.deployments[] | select((.uid // .id) == $id)' <<<"${response}" | head -n1)"
          [ -n "${candidate}" ] || { echo "Rollback target is no longer a READY approved bridge deployment."; exit 1; }

      - name: Roll back Production traffic to approved bridge
        id: rollback
        shell: bash
        run: |
          set -euo pipefail

          body_file="$(mktemp)"
          status="$(curl --silent --show-error             --output "${body_file}"             --write-out '%{http_code}'             --request POST             --url "https://api.vercel.com/v1/projects/${PROJECT_ID}/rollback/${ROLLBACK_DEPLOYMENT_ID}?teamId=${TEAM_ID}"             --header "Accept: application/json"             --header "Authorization: Bearer ${VERCEL_TOKEN}")"

          [[ "${status}" =~ ^2[0-9][0-9]$ ]] || {
            echo "Vercel rollback request failed with HTTP ${status}."
            cat "${body_file}"
            exit 1
          }

          echo "status=${status}" >> "${GITHUB_OUTPUT}"

      - name: Emit rollback summary
        shell: bash
        env:
          ROLLBACK_STATUS: ${{ steps.rollback.outputs.status }}
        run: |
          {
            echo "## Production Vercel rollback: REQUEST ACCEPTED"
            echo
            echo "- current release SHA: \`${RELEASE_SHA}\`"
            echo "- rollback target bridge SHA: \`${BRIDGE_SHA}\`"
            echo "- rollback deployment ID: \`${ROLLBACK_DEPLOYMENT_ID}\`"
            echo "- Vercel API status: \`${ROLLBACK_STATUS}\`"
            echo
            echo "The database is not rolled back by this workflow."
            echo "Run Production Bridge Rollback Smoke immediately."
          } >> "${GITHUB_STEP_SUMMARY}"
