name: Production Final Release Acceptance
run-name: Production acceptance ${{ inputs.deployment_id }}

on:
  workflow_dispatch:
    inputs:
      release_sha:
        description: Exact current main application commit SHA serving Production
        required: true
        type: string
      deployment_id:
        description: Vercel deployment ID serving Production
        required: true
        type: string
      promotion_run_id:
        description: Successful release-branch Production Promote run ID
        required: true
        type: string
      post_deploy_smoke_run_id:
        description: Successful release-branch Production Post-deploy Smoke run ID
        required: true
        type: string
      observation_minutes:
        description: Runtime log window in minutes
        required: true
        default: '10'
        type: string

permissions:
  contents: read
  actions: read

concurrency:
  group: coco-production-final-release-acceptance
  cancel-in-progress: true

jobs:
  accept-release:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ORG_ID: team_P1Z1wvYF1h42LIl0YfgXoOPI
      VERCEL_PROJECT_ID: prj_AcjmJFO5jcqse6sStknZzZkmfR7h
      VERCEL_TEAM_SLUG: hiroyuki-desperado-yahoocojps-projects
      RELEASE_SHA: ${{ inputs.release_sha }}
      DEPLOYMENT_ID: ${{ inputs.deployment_id }}
      PROMOTION_RUN_ID: ${{ inputs.promotion_run_id }}
      POST_DEPLOY_SMOKE_RUN_ID: ${{ inputs.post_deploy_smoke_run_id }}
      OBSERVATION_MINUTES: ${{ inputs.observation_minutes }}
      PRODUCTION_ALIAS: x-clone-olive-chi.vercel.app
      RELEASE_BRANCH: release/current-main-candidate-20261002

    steps:
      - name: Verify acceptance inputs
        shell: bash
        run: |
          set -euo pipefail

          [ -n "${VERCEL_TOKEN:-}" ] || { echo "VERCEL_TOKEN is not configured."; exit 1; }
          [[ "${RELEASE_SHA}" =~ ^[0-9a-f]{40}$ ]] || { echo "release_sha must be a full Git SHA."; exit 1; }
          [[ "${DEPLOYMENT_ID}" =~ ^dpl_[A-Za-z0-9]+$ ]] || { echo "deployment_id must be a Vercel deployment ID."; exit 1; }
          [[ "${PROMOTION_RUN_ID}" =~ ^[0-9]+$ ]] || { echo "promotion_run_id must be numeric."; exit 1; }
          [[ "${POST_DEPLOY_SMOKE_RUN_ID}" =~ ^[0-9]+$ ]] || { echo "post_deploy_smoke_run_id must be numeric."; exit 1; }
          [[ "${OBSERVATION_MINUTES}" =~ ^[0-9]+$ ]] || { echo "observation_minutes must be numeric."; exit 1; }
          [ "${OBSERVATION_MINUTES}" -ge 5 ] || { echo "observation_minutes must be at least 5."; exit 1; }
          [ "${OBSERVATION_MINUTES}" -le 60 ] || { echo "observation_minutes cannot exceed 60."; exit 1; }

      - name: Verify current main and release attestations
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail

          main_sha="$(gh api "repos/${REPOSITORY}/branches/main" --jq '.commit.sha')"
          [ "${RELEASE_SHA}" = "${main_sha}" ] || { echo "release_sha does not match current main."; exit 1; }

          promotion="$(gh api "repos/${REPOSITORY}/actions/runs/${PROMOTION_RUN_ID}")"
          [ "$(jq -r '.conclusion // ""' <<<"${promotion}")" = "success" ] || { echo "Promotion run did not succeed."; exit 1; }
          [ "$(jq -r '.head_branch // ""' <<<"${promotion}")" = "${RELEASE_BRANCH}" ] || { echo "Promotion branch mismatch."; exit 1; }
          [ "$(jq -r '.path // ""' <<<"${promotion}")" = ".github/workflows/production-vercel-promote.yml" ] || { echo "Promotion workflow mismatch."; exit 1; }
          [ "$(jq -r '.display_title // ""' <<<"${promotion}")" = "Production promote ${DEPLOYMENT_ID}" ] || { echo "Promotion deployment ID mismatch."; exit 1; }

          smoke="$(gh api "repos/${REPOSITORY}/actions/runs/${POST_DEPLOY_SMOKE_RUN_ID}")"
          [ "$(jq -r '.conclusion // ""' <<<"${smoke}")" = "success" ] || { echo "Post-deploy smoke did not succeed."; exit 1; }
          [ "$(jq -r '.head_branch // ""' <<<"${smoke}")" = "${RELEASE_BRANCH}" ] || { echo "Post-deploy smoke branch mismatch."; exit 1; }
          [ "$(jq -r '.path // ""' <<<"${smoke}")" = ".github/workflows/production-post-deploy-smoke.yml" ] || { echo "Post-deploy smoke workflow mismatch."; exit 1; }
          [ "$(jq -r '.display_title // ""' <<<"${smoke}")" = "Production smoke ${DEPLOYMENT_ID}" ] || { echo "Post-deploy smoke deployment ID mismatch."; exit 1; }

      - name: Verify exact deployment remains READY and serves release SHA
        id: deployment
        shell: bash
        run: |
          set -euo pipefail

          details="$(curl --fail-with-body --silent --show-error             --request GET             --url "https://api.vercel.com/v13/deployments/${DEPLOYMENT_ID}?withGitRepoInfo=true&teamId=${VERCEL_ORG_ID}"             --header "Accept: application/json"             --header "Authorization: Bearer ${VERCEL_TOKEN}")"

          actual_id="$(jq -r '.id // .uid // ""' <<<"${details}")"
          actual_url="$(jq -r '.url // ""' <<<"${details}")"
          actual_state="$(jq -r '.readyState // .state // ""' <<<"${details}")"
          actual_target="$(jq -r '.target // ""' <<<"${details}")"
          actual_sha="$(jq -r '.meta.githubCommitSha // .gitSource.sha // ""' <<<"${details}")"
          release_meta="$(jq -r '.meta.cocoFinalReleaseSha // ""' <<<"${details}")"

          [ "${actual_id}" = "${DEPLOYMENT_ID}" ] || { echo "Deployment ID mismatch."; exit 1; }
          [ "${actual_state}" = "READY" ] || { echo "Deployment is not READY."; exit 1; }
          [ "${actual_target}" = "production" ] || { echo "Deployment is not Production-target."; exit 1; }
          [ -n "${actual_url}" ] || { echo "Deployment URL is missing."; exit 1; }
          [ "${actual_sha}" = "${RELEASE_SHA}" ] || { echo "Deployment release SHA mismatch."; exit 1; }
          [ "${release_meta}" = "${RELEASE_SHA}" ] || { echo "Final release metadata mismatch."; exit 1; }

          echo "url=${actual_url}" >> "${GITHUB_OUTPUT}"

      - name: Verify Production alias still points to deployment
        shell: bash
        run: |
          set -euo pipefail

          aliases="$(curl --fail-with-body --silent --show-error             --request GET             --url "https://api.vercel.com/v2/deployments/${DEPLOYMENT_ID}/aliases?teamId=${VERCEL_ORG_ID}"             --header "Accept: application/json"             --header "Authorization: Bearer ${VERCEL_TOKEN}")"

          count="$(jq --arg alias "${PRODUCTION_ALIAS}" '[.aliases[] | select(.alias == $alias)] | length' <<<"${aliases}")"
          [ "${count}" -ge 1 ] || {
            echo "Production alias no longer points to the accepted deployment."
            exit 1
          }

      - name: Verify Production health one more time
        shell: bash
        run: |
          set -euo pipefail
          health="$(curl --fail --silent --show-error "https://${PRODUCTION_ALIAS}/api/health")"
          [ "$(jq -r '.status // ""' <<<"${health}")" = "ok" ] || exit 1
          [ "$(jq -r '.database // ""' <<<"${health}")" = "ok" ] || exit 1
          [ "$(jq -r '.releaseSha // ""' <<<"${health}")" = "${RELEASE_SHA}" ] || exit 1

      - name: Link Vercel CLI to confirmed project
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .vercel
          jq -n             --arg orgId "${VERCEL_ORG_ID}"             --arg projectId "${VERCEL_PROJECT_ID}"             '{orgId:$orgId, projectId:$projectId}' > .vercel/project.json

      - name: Scan exact deployment for recent 5xx responses
        id: five_xx
        shell: bash
        env:
          DEPLOYMENT_URL: ${{ steps.deployment.outputs.url }}
        run: |
          set -euo pipefail

          log_file="$(mktemp)"
          npx --yes vercel@59.19.1 logs             --deployment "https://${DEPLOYMENT_URL}"             --status-code 5xx             --since "${OBSERVATION_MINUTES}m"             --json             --token "${VERCEL_TOKEN}"             --scope "${VERCEL_TEAM_SLUG}" >"${log_file}"

          count="$(node - "${log_file}" <<'NODE'
          const fs = require('node:fs');
          const path = process.argv[2];
          const lines = fs.readFileSync(path, 'utf8').split(/\r?\n/).filter((line) => line.trim());
          for (const line of lines) JSON.parse(line);
          process.stdout.write(String(lines.length));
          NODE
          )"

          echo "count=${count}" >> "${GITHUB_OUTPUT}"

          if [ "${count}" -gt 0 ]; then
            echo "Detected ${count} 5xx runtime log entries for the exact deployment."
            cat "${log_file}"
            exit 1
          fi

      - name: Scan exact deployment for application error logs
        id: errors
        shell: bash
        env:
          DEPLOYMENT_URL: ${{ steps.deployment.outputs.url }}
        run: |
          set -euo pipefail

          log_file="$(mktemp)"
          npx --yes vercel@59.19.1 logs             --deployment "https://${DEPLOYMENT_URL}"             --level error             --since "${OBSERVATION_MINUTES}m"             --json             --token "${VERCEL_TOKEN}"             --scope "${VERCEL_TEAM_SLUG}" >"${log_file}"

          count="$(node - "${log_file}" <<'NODE'
          const fs = require('node:fs');
          const path = process.argv[2];
          const lines = fs.readFileSync(path, 'utf8').split(/\r?\n/).filter((line) => line.trim());
          for (const line of lines) JSON.parse(line);
          process.stdout.write(String(lines.length));
          NODE
          )"

          echo "count=${count}" >> "${GITHUB_OUTPUT}"

          if [ "${count}" -gt 0 ]; then
            echo "::warning::Detected ${count} application error log entries. 5xx gate remains clear, but review these logs."
            cat "${log_file}"
          fi

      - name: Emit release acceptance summary
        shell: bash
        env:
          DEPLOYMENT_URL: ${{ steps.deployment.outputs.url }}
          FIVE_XX_COUNT: ${{ steps.five_xx.outputs.count }}
          ERROR_COUNT: ${{ steps.errors.outputs.count }}
        run: |
          {
            echo "## Production release acceptance: PASS"
            echo
            echo "- release SHA: \`${RELEASE_SHA}\`"
            echo "- deployment ID: \`${DEPLOYMENT_ID}\`"
            echo "- deployment URL: \`${DEPLOYMENT_URL}\`"
            echo "- Production alias: \`${PRODUCTION_ALIAS}\`"
            echo "- post-deploy smoke: verified"
            echo "- observation window: \`${OBSERVATION_MINUTES} minutes\`"
            echo "- 5xx runtime log entries: \`${FIVE_XX_COUNT}\`"
            echo "- application error log entries: \`${ERROR_COUNT}\`"
          } >> "${GITHUB_STEP_SUMMARY}"
