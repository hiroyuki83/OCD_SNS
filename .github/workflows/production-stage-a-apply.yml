name: Production Stage A Apply

on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: Type APPLY_COCO_PRODUCTION_STAGE_A
        required: true
        type: string
      rollback_point:
        description: Verified Production rollback branch ID
        required: true
        type: string
      rollback_verification_run_id:
        description: Successful Production Rollback Point Verification run ID for this rollback branch
        required: true
        type: string
      release_sha:
        description: Exact current main commit SHA
        required: true
        type: string
      expected_unpooled_host:
        description: Exact direct/unpooled Production Neon hostname
        required: true
        type: string
      preflight_run_id:
        description: Successful Production DB Read-only Preflight run ID for this release SHA
        required: true
        type: string
      stage_a_dry_run_id:
        description: Successful Production Stage A Dry Run ID for this release SHA
        required: true
        type: string
      pre_execution_self_check_run_id:
        description: Successful Production Pre-execution Self Check run ID for this release SHA
        required: true
        type: string

permissions:
  contents: read
  actions: read

concurrency:
  group: coco-production-stage-a-apply
  cancel-in-progress: false

jobs:
  apply-stage-a:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      DATABASE_URL: ${{ secrets.PRODUCTION_DATABASE_URL_UNPOOLED }}
      PRODUCTION_DATABASE_URL: ${{ secrets.PRODUCTION_DATABASE_URL_UNPOOLED }}
      PRODUCTION_DATABASE_HOST: ${{ inputs.expected_unpooled_host }}
      PRODUCTION_DATABASE_NAME: neondb
      PRODUCTION_MIGRATION_CONFIRM: CHECK_COCO_PRODUCTION
      VERCEL_ENV: production
      VERCEL_GIT_COMMIT_REF: main
      RELEASE_SHA: ${{ inputs.release_sha }}
      ROLLBACK_POINT: ${{ inputs.rollback_point }}
      ROLLBACK_VERIFICATION_RUN_ID: ${{ inputs.rollback_verification_run_id }}
      APPLY_CONFIRMATION: ${{ inputs.confirmation }}
      PREFLIGHT_RUN_ID: ${{ inputs.preflight_run_id }}
      STAGE_A_DRY_RUN_ID: ${{ inputs.stage_a_dry_run_id }}
      PRE_EXECUTION_SELF_CHECK_RUN_ID: ${{ inputs.pre_execution_self_check_run_id }}

    steps:
      - name: Verify explicit Stage A approval inputs
        shell: bash
        run: |
          set -euo pipefail
          [ "${APPLY_CONFIRMATION}" = "APPLY_COCO_PRODUCTION_STAGE_A" ] || { echo "Exact Stage A confirmation is required."; exit 1; }
          [[ "${ROLLBACK_POINT}" =~ ^br-[a-z0-9-]+$ ]] || { echo "Verified rollback branch ID is required."; exit 1; }
          [[ "${ROLLBACK_VERIFICATION_RUN_ID}" =~ ^[0-9]+$ ]] || { echo "Numeric rollback verification run ID is required."; exit 1; }
          [ -n "${RELEASE_SHA}" ] || { echo "Exact release SHA is required."; exit 1; }
          [[ "${PRODUCTION_DATABASE_HOST}" != *"-pooler."* ]] || { echo "Direct/unpooled hostname is required."; exit 1; }
          [ -n "${PRODUCTION_DATABASE_URL:-}" ] || { echo "PRODUCTION_DATABASE_URL_UNPOOLED is not configured."; exit 1; }
          [[ "${PREFLIGHT_RUN_ID}" =~ ^[0-9]+$ ]] || { echo "Numeric preflight run ID is required."; exit 1; }
          [[ "${STAGE_A_DRY_RUN_ID}" =~ ^[0-9]+$ ]] || { echo "Numeric Stage A dry-run ID is required."; exit 1; }
          [[ "${PRE_EXECUTION_SELF_CHECK_RUN_ID}" =~ ^[0-9]+$ ]] || { echo "Numeric pre-execution self-check run ID is required."; exit 1; }

      - name: Verify workflow is running from exact main release commit
        shell: bash
        env:
          WORKFLOW_SHA: ${{ github.sha }}
          WORKFLOW_REF: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          [ "${WORKFLOW_REF}" = "main" ] || { echo "Stage A must be dispatched from main."; exit 1; }
          [ "${RELEASE_SHA}" = "${WORKFLOW_SHA}" ] || { echo "release_sha must match current main."; exit 1; }

      - name: Verify pre-execution self-check attestation
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          j="$(gh api "repos/${REPOSITORY}/actions/runs/${PRE_EXECUTION_SELF_CHECK_RUN_ID}")"
          [ "$(jq -r '.conclusion // ""' <<<"${j}")" = "success" ] || { echo "Pre-execution self-check did not succeed."; exit 1; }
          [ "$(jq -r '.head_sha // ""' <<<"${j}")" = "${RELEASE_SHA}" ] || { echo "Pre-execution self-check SHA mismatch."; exit 1; }
          [ "$(jq -r '.event // ""' <<<"${j}")" = "workflow_dispatch" ] || { echo "Pre-execution self-check must be manually dispatched."; exit 1; }
          [ "$(jq -r '.path // ""' <<<"${j}")" = ".github/workflows/production-pre-execution-self-check.yml" ] || { echo "Referenced run is not Production Pre-execution Self Check."; exit 1; }
          [ "$(jq -r '.display_title // ""' <<<"${j}")" = "Production pre-execution self-check ${RELEASE_SHA}" ] || { echo "Pre-execution self-check release SHA binding mismatch."; exit 1; }

      - name: Verify rollback point attestation
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          j="$(gh api "repos/${REPOSITORY}/actions/runs/${ROLLBACK_VERIFICATION_RUN_ID}")"
          [ "$(jq -r '.conclusion // ""' <<<"${j}")" = "success" ] || { echo "Rollback verification run did not succeed."; exit 1; }
          [ "$(jq -r '.head_sha // ""' <<<"${j}")" = "${RELEASE_SHA}" ] || { echo "Rollback verification run SHA mismatch."; exit 1; }
          [ "$(jq -r '.event // ""' <<<"${j}")" = "workflow_dispatch" ] || { echo "Rollback verification must be manually dispatched."; exit 1; }
          [ "$(jq -r '.path // ""' <<<"${j}")" = ".github/workflows/production-rollback-point-verify.yml" ] || { echo "Referenced run is not the rollback verification workflow."; exit 1; }
          [ "$(jq -r '.display_title // ""' <<<"${j}")" = "Production rollback verify ${ROLLBACK_POINT}" ] || { echo "Rollback verification branch ID does not match rollback_point."; exit 1; }

      - name: Verify read-only preflight attestation
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          j="$(gh api "repos/${REPOSITORY}/actions/runs/${PREFLIGHT_RUN_ID}")"
          [ "$(jq -r '.conclusion // ""' <<<"${j}")" = "success" ] || exit 1
          [ "$(jq -r '.head_sha // ""' <<<"${j}")" = "${RELEASE_SHA}" ] || exit 1
          [ "$(jq -r '.head_branch // ""' <<<"${j}")" = "main" ] || exit 1
          [ "$(jq -r '.path // ""' <<<"${j}")" = ".github/workflows/production-db-preflight.yml" ] || exit 1

      - name: Verify Stage A dry-run attestation
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          j="$(gh api "repos/${REPOSITORY}/actions/runs/${STAGE_A_DRY_RUN_ID}")"
          [ "$(jq -r '.conclusion // ""' <<<"${j}")" = "success" ] || exit 1
          [ "$(jq -r '.head_sha // ""' <<<"${j}")" = "${RELEASE_SHA}" ] || exit 1
          [ "$(jq -r '.path // ""' <<<"${j}")" = ".github/workflows/production-stage-a-dry-run.yml" ] || exit 1

      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.release_sha }}
      - uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npx prisma generate

      - name: Re-check accepted legacy Production baseline
        run: npm run production:reconciliation:precheck

      - name: Apply guarded legacy reconciliation
        shell: bash
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const { Client } = require('pg');
          (async () => {
            const client = new Client({ connectionString: process.env.DATABASE_URL });
            await client.connect();
            try {
              await client.query(fs.readFileSync('scripts/production-legacy-moderation-reconcile.sql', 'utf8'));
            } finally {
              await client.end();
            }
          })().catch((error) => { console.error(error); process.exit(1); });
          NODE

      - name: Resolve already-present restrictionUntil migration
        run: npx prisma migrate resolve --applied 20260926103000_add_restriction_until

      - name: Apply only additive Stage A migrations
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/coco-stage-c-migrations
          for dir in prisma/migrations/[0-9]*; do
            name="$(basename "$dir")"
            if [[ "$name" > "20260927002000_add_follow_approval" ]]; then
              mv "$dir" /tmp/coco-stage-c-migrations/
            fi
          done
          npx prisma migrate deploy
          for dir in /tmp/coco-stage-c-migrations/*; do mv "$dir" prisma/migrations/; done

      - name: Verify Stage A boundary without crossing destructive migration
        run: npx tsx scripts/production-stage-a-verify.ts
