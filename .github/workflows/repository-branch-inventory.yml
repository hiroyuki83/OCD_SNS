name: Repository Branch Inventory

on:
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: coco-repository-branch-inventory
  cancel-in-progress: true

jobs:
  inventory:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Inventory branches against main
        id: inventory
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail

          branches_file="${RUNNER_TEMP}/branches.json"
          prs_file="${RUNNER_TEMP}/open-prs.json"
          inventory_file="${RUNNER_TEMP}/branch-inventory.json"

          gh api --paginate "repos/${REPOSITORY}/branches?per_page=100" | jq -s 'add' > "${branches_file}"
          gh api --paginate --method GET "repos/${REPOSITORY}/pulls?state=open&per_page=100" | jq -s 'add' > "${prs_file}"

          echo '[]' > "${inventory_file}"

          while IFS= read -r branch_name; do
            protected="$(jq -r --arg branch "${branch_name}" '.[] | select(.name == $branch) | (.protected // false)' "${branches_file}")"
            sha="$(jq -r --arg branch "${branch_name}" '.[] | select(.name == $branch) | .commit.sha' "${branches_file}")"
            open_prs="$(jq --arg branch "${branch_name}" '[.[] | select(.head.ref == $branch)] | length' "${prs_file}")"

            ahead=-1
            behind=-1
            compare_status="not-checked"
            classification="review-required"

            if [ "${branch_name}" = "main" ]; then
              classification="default-branch"
            elif [ "${branch_name}" = "preview" ]; then
              classification="retained-preview"
            elif [ "${protected}" = "true" ]; then
              classification="protected-review"
            elif [ "${open_prs}" -gt 0 ]; then
              classification="open-pr"
            else
              encoded="$(jq -nr --arg v "${branch_name}" '$v|@uri')"
              compare="$(gh api "repos/${REPOSITORY}/compare/main...${encoded}")"
              ahead="$(jq -r '.ahead_by // -1' <<<"${compare}")"
              behind="$(jq -r '.behind_by // -1' <<<"${compare}")"
              compare_status="$(jq -r '.status // ""' <<<"${compare}")"

              if [ "${ahead}" -eq 0 ]; then
                classification="safe-delete"
              else
                classification="review-required"
              fi
            fi

            row="$(jq -n               --arg branch "${branch_name}"               --arg sha "${sha}"               --argjson protected "${protected}"               --argjson open_prs "${open_prs}"               --argjson ahead "${ahead}"               --argjson behind "${behind}"               --arg compare_status "${compare_status}"               --arg classification "${classification}"               '{
                branch: $branch,
                sha: $sha,
                protected: $protected,
                open_prs: $open_prs,
                ahead_of_main: $ahead,
                behind_main: $behind,
                compare_status: $compare_status,
                classification: $classification
              }'
            )"

            jq --argjson row "${row}" '. + [$row]' "${inventory_file}" > "${inventory_file}.tmp"
            mv "${inventory_file}.tmp" "${inventory_file}"
          done < <(jq -r '.[].name' "${branches_file}" | sort)

          total="$(jq 'length' "${inventory_file}")"
          safe="$(jq '[.[] | select(.classification == "safe-delete")] | length' "${inventory_file}")"
          review="$(jq '[.[] | select(.classification == "review-required")] | length' "${inventory_file}")"
          open_pr="$(jq '[.[] | select(.classification == "open-pr")] | length' "${inventory_file}")"
          protected_count="$(jq '[.[] | select(.classification == "protected-review")] | length' "${inventory_file}")"
          retained_preview="$(jq '[.[] | select(.classification == "retained-preview")] | length' "${inventory_file}")"

          echo "total=${total}" >> "${GITHUB_OUTPUT}"
          echo "safe=${safe}" >> "${GITHUB_OUTPUT}"
          echo "review=${review}" >> "${GITHUB_OUTPUT}"
          echo "open_pr=${open_pr}" >> "${GITHUB_OUTPUT}"
          echo "protected=${protected_count}" >> "${GITHUB_OUTPUT}"
          echo "retained_preview=${retained_preview}" >> "${GITHUB_OUTPUT}"

          cp "${inventory_file}" branch-inventory.json

          {
            echo "# Repository Branch Inventory"
            echo
            echo "| Branch | Classification | Ahead | Behind | Protected | Open PRs |"
            echo "|---|---|---:|---:|---|---:|"
            jq -r '.[] | "| (.branch) | (.classification) | (.ahead_of_main) | (.behind_main) | (.protected) | (.open_prs) |"' "${inventory_file}"
          } > branch-inventory.md

      - name: Emit branch inventory summary
        shell: bash
        env:
          TOTAL: ${{ steps.inventory.outputs.total }}
          SAFE: ${{ steps.inventory.outputs.safe }}
          REVIEW: ${{ steps.inventory.outputs.review }}
          OPEN_PR: ${{ steps.inventory.outputs.open_pr }}
          PROTECTED: ${{ steps.inventory.outputs.protected }}
          RETAINED_PREVIEW: ${{ steps.inventory.outputs.retained_preview }}
        run: |
          {
            echo "## Repository branch inventory"
            echo
            echo "- total branches: \`${TOTAL}\`"
            echo "- safe-delete candidates: \`${SAFE}\`"
            echo "- review-required branches: \`${REVIEW}\`"
            echo "- branches with open PRs: \`${OPEN_PR}\`"
            echo "- protected non-main branches: \`${PROTECTED}\`"
            echo "- retained Preview branches: \`${RETAINED_PREVIEW}\`"
            echo
            echo "Classification rule:"
            echo "- retained-preview = long-lived Preview acceptance branch; never a cleanup candidate"
            echo "- safe-delete = non-main/non-preview, unprotected, no open PR, ahead_of_main = 0"
            echo "- review-required = branch has commits not contained in main"
            echo
            echo "This workflow is read-only. It never deletes or moves a branch."
            echo
            echo "### Safe-delete candidates"
            echo
            awk -F'|' '$3 ~ /safe-delete/ {gsub(/^ +| +$/, "", $2); print "- `" $2 "`"}' branch-inventory.md
          } >> "${GITHUB_STEP_SUMMARY}"

      - name: Upload branch inventory
        uses: actions/upload-artifact@v4
        with:
          name: repository-branch-inventory
          path: |
            branch-inventory.json
            branch-inventory.md
          if-no-files-found: error
          retention-days: 14
