name: Production Bridge Vercel Promote
run-name: Production bridge promote ${{ inputs.deployment_id }}

on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: Type PROMOTE_COCO_BRIDGE_PRODUCTION
        required: true
        type: string
      release_sha:
        description: Exact current main SHA for the staged release
        required: true
        type: string
      deployment_id:
        description: Verified bridge Vercel deployment ID
        required: true
        type: string
      stage_a_apply_run_id:
        description: Successful Production Stage A Apply run ID
        required: true
        type: string
      bridge_validation_run_id:
        description: Successful Production Bridge Validation run ID
        required: true
        type: string
      bridge_candidate_run_id:
        description: Successful Production Bridge Vercel Candidate run ID
        required: true
        type: string

permissions:
  contents: read
  actions: read

concurrency:
  group: coco-production-bridge-vercel-promote
  cancel-in-progress: false

jobs:
  promote:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      TEAM_ID: team_P1Z1wvYF1h42LIl0YfgXoOPI
      PROJECT_ID: prj_AcjmJFO5jcqse6sStknZzZkmfR7h
      CONFIRMATION: ${{ inputs.confirmation }}
      RELEASE_SHA: ${{ inputs.release_sha }}
      DEPLOYMENT_ID: ${{ inputs.deployment_id }}
      STAGE_A_APPLY_RUN_ID: ${{ inputs.stage_a_apply_run_id }}
      BRIDGE_VALIDATION_RUN_ID: ${{ inputs.bridge_validation_run_id }}
      BRIDGE_CANDIDATE_RUN_ID: ${{ inputs.bridge_candidate_run_id }}
      BRIDGE_SHA: 64d5ad3fbc4e09f87ba8a09fdd75a9f823bccda1

    steps:
      - name: Verify explicit bridge promotion inputs
        shell: bash
        run: |
          set -euo pipefail
          [ "${CONFIRMATION}" = "PROMOTE_COCO_BRIDGE_PRODUCTION" ] || { echo "Exact bridge promotion confirmation is required."; exit 1; }
          [ -n "${VERCEL_TOKEN:-}" ] || { echo "VERCEL_TOKEN is not configured."; exit 1; }
          [[ "${RELEASE_SHA}" =~ ^[0-9a-f]{40}$ ]] || { echo "release_sha must be a full Git SHA."; exit 1; }
          [[ "${DEPLOYMENT_ID}" =~ ^dpl_[A-Za-z0-9]+$ ]] || { echo "deployment_id must be a Vercel deployment ID."; exit 1; }
          for id in "${STAGE_A_APPLY_RUN_ID}" "${BRIDGE_VALIDATION_RUN_ID}" "${BRIDGE_CANDIDATE_RUN_ID}"; do
            [[ "${id}" =~ ^[0-9]+$ ]] || { echo "All run IDs must be numeric."; exit 1; }
          done

      - name: Verify exact current main SHA and attestations
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          main_sha="$(gh api "repos/${REPOSITORY}/branches/main" --jq '.commit.sha')"
          [ "${RELEASE_SHA}" = "${main_sha}" ] || { echo "release_sha does not match current main."; exit 1; }

          verify_run() {
            run_id="$1"
            expected_path="$2"
            expected_title="$3"
            j="$(gh api "repos/${REPOSITORY}/actions/runs/${run_id}")"
            [ "$(jq -r '.conclusion // ""' <<<"${j}")" = "success" ] || { echo "Run ${run_id} did not succeed."; exit 1; }
            [ "$(jq -r '.head_sha // ""' <<<"${j}")" = "${RELEASE_SHA}" ] || { echo "Run ${run_id} SHA mismatch."; exit 1; }
            [ "$(jq -r '.path // ""' <<<"${j}")" = "${expected_path}" ] || { echo "Run ${run_id} workflow mismatch."; exit 1; }
            if [ -n "${expected_title}" ]; then
              [ "$(jq -r '.display_title // ""' <<<"${j}")" = "${expected_title}" ] || { echo "Run ${run_id} deployment mismatch."; exit 1; }
            fi
          }

          verify_run "${STAGE_A_APPLY_RUN_ID}" ".github/workflows/production-stage-a-apply.yml" ""
          verify_run "${BRIDGE_VALIDATION_RUN_ID}" ".github/workflows/production-bridge-validation.yml" ""
          verify_run "${BRIDGE_CANDIDATE_RUN_ID}" ".github/workflows/production-bridge-vercel-candidate.yml" "Production bridge candidate verify ${DEPLOYMENT_ID}"

      - name: Re-verify staged Production bridge artifact immediately before promotion
        shell: bash
        env:
          PRODUCTION_ALIAS: x-clone-olive-chi.vercel.app
        run: |
          set -euo pipefail

          details="$(curl --fail-with-body --silent --show-error \
            --request GET \
            --url "https://api.vercel.com/v13/deployments/${DEPLOYMENT_ID}?withGitRepoInfo=true&teamId=${TEAM_ID}" \
            --header "Accept: application/json" \
            --header "Authorization: Bearer ${VERCEL_TOKEN}")"

          actual_id="$(jq -r '.id // .uid // ""' <<<"${details}")"
          state="$(jq -r '.readyState // .state // ""' <<<"${details}")"
          target="$(jq -r '.target // ""' <<<"${details}")"
          bridge_meta="$(jq -r '.meta.cocoBridgeSha // ""' <<<"${details}")"
          release_meta="$(jq -r '.meta.cocoReleaseSha // ""' <<<"${details}")"
          build_guard="$(jq -r '.meta.cocoBuildGuard // ""' <<<"${details}")"
          alias_bound="$(jq -r --arg alias "${PRODUCTION_ALIAS}" '[(.alias // [])[] | select(. == $alias)] | length' <<<"${details}")"

          [ "${actual_id}" = "${DEPLOYMENT_ID}" ] || { echo "Bridge deployment ID mismatch."; exit 1; }
          [ "${state}" = "READY" ] || { echo "Bridge artifact is no longer READY."; exit 1; }
          [ "${target}" = "production" ] || { echo "Bridge artifact is not a staged Production-target deployment."; exit 1; }
          [ "${bridge_meta}" = "${BRIDGE_SHA}" ] || { echo "Bridge SHA attestation mismatch."; exit 1; }
          [ "${release_meta}" = "${RELEASE_SHA}" ] || { echo "Release SHA attestation mismatch."; exit 1; }
          [ "${build_guard}" = "safe-no-migrate" ] || { echo "Safe bridge build guard attestation is missing."; exit 1; }
          [ "${alias_bound}" = "0" ] || { echo "Production alias is already assigned to this bridge deployment."; exit 1; }

      - name: Promote approved bridge deployment to Production
        id: promote
        shell: bash
        run: |
          set -euo pipefail
          body="$(mktemp)"
          status="$(curl --silent --show-error --output "${body}" --write-out '%{http_code}'             --request POST             --url "https://api.vercel.com/v10/projects/${PROJECT_ID}/promote/${DEPLOYMENT_ID}?teamId=${TEAM_ID}"             --header "Accept: application/json"             --header "Authorization: Bearer ${VERCEL_TOKEN}")"
          [[ "${status}" =~ ^2[0-9][0-9]$ ]] || { echo "Bridge promotion failed with HTTP ${status}."; cat "${body}"; exit 1; }
          echo "status=${status}" >> "${GITHUB_OUTPUT}"

      - name: Emit bridge promotion summary
        shell: bash
        env:
          STATUS: ${{ steps.promote.outputs.status }}
        run: |
          {
            echo "## Production bridge promotion: REQUEST ACCEPTED"
            echo
            echo "- staged release SHA: \`${RELEASE_SHA}\`"
            echo "- bridge SHA: \`${BRIDGE_SHA}\`"
            echo "- bridge deployment ID: \`${DEPLOYMENT_ID}\`"
            echo "- Vercel API status: \`${STATUS}\`"
            echo
            echo "Run Production Bridge Production Smoke immediately."
          } >> "${GITHUB_STEP_SUMMARY}"
