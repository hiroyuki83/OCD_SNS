name: Production DB Read-only Preflight

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: coco-production-db-readonly-preflight
  cancel-in-progress: false

jobs:
  preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      DATABASE_URL: ${{ secrets.PRODUCTION_DATABASE_URL }}
      PRODUCTION_DATABASE_URL: ${{ secrets.PRODUCTION_DATABASE_URL }}
      PRODUCTION_DATABASE_HOST: ep-billowing-smoke-ah3grpmy-pooler.c-3.us-east-1.aws.neon.tech
      PRODUCTION_DATABASE_NAME: neondb
      PRODUCTION_MIGRATION_CONFIRM: CHECK_COCO_PRODUCTION
      VERCEL_ENV: production
      VERCEL_GIT_COMMIT_REF: main

    steps:
      - name: Checkout main
        uses: actions/checkout@v6
        with:
          ref: main

      - name: Use Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm

      - name: Verify Production DB secret is configured
        shell: bash
        run: |
          if [ -z "${PRODUCTION_DATABASE_URL:-}" ]; then
            echo "PRODUCTION_DATABASE_URL repository secret is not configured."
            exit 1
          fi

      - name: Install dependencies
        run: npm ci

      - name: Run read-only Production DB preflight
        run: npm run production:db:preflight
