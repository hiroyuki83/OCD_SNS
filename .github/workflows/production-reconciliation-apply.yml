name: Deprecated Production Reconciliation Apply

on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: This workflow is deprecated; use Stage A and Stage C workflows
        required: true
        type: string

permissions:
  contents: read

jobs:
  blocked:
    runs-on: ubuntu-latest
    steps:
      - name: Refuse deprecated release path
        run: |
          echo "This workflow is deprecated and intentionally blocked."
          echo "Use Production Stage A Apply, deploy/verify the approved bridge, then Production Stage C Apply."
          exit 1
