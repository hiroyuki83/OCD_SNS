name: Production Final Post-deploy Smoke
run-name: Production smoke ${{ inputs.deployment_id }}

on:
  workflow_dispatch:
    inputs:
      release_sha:
        description: Exact current main application commit SHA expected in Production
        required: true
        type: string
      deploy_readiness_run_id:
        description: Successful Production Deploy Readiness run ID for this release SHA
        required: true
        type: string
      deployment_id:
        description: Vercel deployment ID promoted to Production
        required: true
        type: string
      promotion_run_id:
        description: Successful release-branch Production Promote run ID
        required: true
        type: string

permissions:
  contents: read
  actions: read

concurrency:
  group: coco-production-final-post-deploy-smoke
  cancel-in-progress: true

jobs:
  production-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      TEAM_ID: team_P1Z1wvYF1h42LIl0YfgXoOPI
      RELEASE_SHA: ${{ inputs.release_sha }}
      DEPLOY_READINESS_RUN_ID: ${{ inputs.deploy_readiness_run_id }}
      DEPLOYMENT_ID: ${{ inputs.deployment_id }}
      PROMOTION_RUN_ID: ${{ inputs.promotion_run_id }}
      PRODUCTION_BASE_URL: https://x-clone-olive-chi.vercel.app
      RELEASE_BRANCH: release/current-main-candidate-20261002

    steps:
      - name: Verify release and promotion attestations
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail

          [[ "${RELEASE_SHA}" =~ ^[0-9a-f]{40}$ ]] || { echo "release_sha must be a full Git SHA."; exit 1; }
          [[ "${DEPLOY_READINESS_RUN_ID}" =~ ^[0-9]+$ ]] || { echo "deploy_readiness_run_id must be numeric."; exit 1; }
          [[ "${DEPLOYMENT_ID}" =~ ^dpl_[A-Za-z0-9]+$ ]] || { echo "deployment_id must be a Vercel deployment ID."; exit 1; }
          [[ "${PROMOTION_RUN_ID}" =~ ^[0-9]+$ ]] || { echo "promotion_run_id must be numeric."; exit 1; }

          main_sha="$(gh api "repos/${REPOSITORY}/branches/main" --jq '.commit.sha')"
          [ "${RELEASE_SHA}" = "${main_sha}" ] || { echo "release_sha does not match current main."; exit 1; }

          readiness="$(gh api "repos/${REPOSITORY}/actions/runs/${DEPLOY_READINESS_RUN_ID}")"
          [ "$(jq -r '.conclusion // ""' <<<"${readiness}")" = "success" ] || { echo "Deploy Readiness did not succeed."; exit 1; }
          [ "$(jq -r '.head_sha // ""' <<<"${readiness}")" = "${RELEASE_SHA}" ] || { echo "Deploy Readiness SHA mismatch."; exit 1; }
          [ "$(jq -r '.path // ""' <<<"${readiness}")" = ".github/workflows/production-deploy-readiness.yml" ] || {
            echo "Deploy Readiness workflow mismatch."
            exit 1
          }

          promotion="$(gh api "repos/${REPOSITORY}/actions/runs/${PROMOTION_RUN_ID}")"
          [ "$(jq -r '.conclusion // ""' <<<"${promotion}")" = "success" ] || { echo "Production promotion did not succeed."; exit 1; }
          [ "$(jq -r '.head_branch // ""' <<<"${promotion}")" = "${RELEASE_BRANCH}" ] || { echo "Promotion branch mismatch."; exit 1; }
          [ "$(jq -r '.path // ""' <<<"${promotion}")" = ".github/workflows/production-vercel-promote.yml" ] || {
            echo "Promotion workflow mismatch."
            exit 1
          }
          [ "$(jq -r '.display_title // ""' <<<"${promotion}")" = "Production promote ${DEPLOYMENT_ID}" ] || {
            echo "Promotion deployment ID mismatch."
            exit 1
          }

      - name: Verify exact deployment and canonical Production alias
        shell: bash
        run: |
          set -euo pipefail

          details="$(curl --fail-with-body --silent --show-error             --request GET             --url "https://api.vercel.com/v13/deployments/${DEPLOYMENT_ID}?withGitRepoInfo=true&teamId=${TEAM_ID}"             --header "Accept: application/json"             --header "Authorization: Bearer ${VERCEL_TOKEN}")"

          state="$(jq -r '.readyState // .state // ""' <<<"${details}")"
          target="$(jq -r '.target // ""' <<<"${details}")"
          git_sha="$(jq -r '.meta.githubCommitSha // .gitSource.sha // ""' <<<"${details}")"

          [ "${state}" = "READY" ] || { echo "Production deployment is not READY."; exit 1; }
          [ "${target}" = "production" ] || { echo "Deployment is not Production-target."; exit 1; }
          [ "${git_sha}" = "${RELEASE_SHA}" ] || { echo "Production deployment SHA mismatch."; exit 1; }

          aliases="$(curl --fail-with-body --silent --show-error             --request GET             --url "https://api.vercel.com/v2/deployments/${DEPLOYMENT_ID}/aliases?teamId=${TEAM_ID}"             --header "Accept: application/json"             --header "Authorization: Bearer ${VERCEL_TOKEN}")"

          count="$(jq '[.aliases[] | select(.alias == "x-clone-olive-chi.vercel.app")] | length' <<<"${aliases}")"
          [ "${count}" -ge 1 ] || { echo "Canonical Production alias is not assigned to deployment."; exit 1; }

      - name: Verify Production health and deployed release SHA
        shell: bash
        run: |
          set -euo pipefail

          health_file="$(mktemp)"
          status="$(curl --silent --show-error --output "${health_file}" --write-out '%{http_code}' "${PRODUCTION_BASE_URL}/api/health")"

          [ "${status}" = "200" ] || {
            echo "Production health returned HTTP ${status}."
            cat "${health_file}"
            exit 1
          }

          [ "$(jq -r '.status // ""' "${health_file}")" = "ok" ] || { echo "Production health status is not ok."; cat "${health_file}"; exit 1; }
          [ "$(jq -r '.database // ""' "${health_file}")" = "ok" ] || { echo "Production database health is not ok."; cat "${health_file}"; exit 1; }

          actual_sha="$(jq -r '.releaseSha // ""' "${health_file}")"
          [ "${actual_sha}" = "${RELEASE_SHA}" ] || {
            echo "Production release SHA mismatch."
            echo "expected=${RELEASE_SHA}"
            echo "actual=${actual_sha}"
            exit 1
          }

      - name: Smoke Production routes and feed
        shell: bash
        run: |
          set -euo pipefail

          for path in / /login /explore /safety; do
            status="$(curl --silent --show-error --output /dev/null --write-out '%{http_code}' "${PRODUCTION_BASE_URL}${path}")"
            [ "${status}" = "200" ] || { echo "${path} returned HTTP ${status}."; exit 1; }
          done

          feed_file="$(mktemp)"
          status="$(curl --silent --show-error --output "${feed_file}" --write-out '%{http_code}' "${PRODUCTION_BASE_URL}/api/feed?page=1")"
          [ "${status}" = "200" ] || { echo "Production feed returned HTTP ${status}."; cat "${feed_file}"; exit 1; }
          node -e "JSON.parse(require('fs').readFileSync(process.argv[1], 'utf8'))" "${feed_file}"

      - name: Verify repeated health stability
        shell: bash
        run: |
          set -euo pipefail
          for attempt in 1 2 3; do
            health="$(curl --fail --silent --show-error "${PRODUCTION_BASE_URL}/api/health")"
            [ "$(jq -r '.status // ""' <<<"${health}")" = "ok" ] || exit 1
            [ "$(jq -r '.database // ""' <<<"${health}")" = "ok" ] || exit 1
            [ "$(jq -r '.releaseSha // ""' <<<"${health}")" = "${RELEASE_SHA}" ] || exit 1
            if [ "${attempt}" -lt 3 ]; then sleep 5; fi
          done

      - name: Emit post-deploy smoke summary
        shell: bash
        run: |
          {
            echo "## Production post-deploy smoke: PASS"
            echo
            echo "- Production URL: \`${PRODUCTION_BASE_URL}\`"
            echo "- release SHA: \`${RELEASE_SHA}\`"
            echo "- deployment ID: \`${DEPLOYMENT_ID}\`"
            echo "- health: ok"
            echo "- database: ok"
            echo "- public routes: ok"
            echo "- DB-backed feed: ok"
            echo "- repeated health stability: ok"
          } >> "${GITHUB_STEP_SUMMARY}"
