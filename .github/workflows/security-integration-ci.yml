name: Security integration CI

on:
  push:
    branches:
      - security-integration-final-20260926
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/coco_ci
      NEXTAUTH_SECRET: ci-only-placeholder-secret-not-used-in-production
      AUTH_SECRET: ci-only-placeholder-secret-not-used-in-production
      STAFF_MFA_ENCRYPTION_KEY: AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Use Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install

      - name: Save generated package lock
        uses: actions/upload-artifact@v4
        with:
          name: generated-package-lock-${{ github.sha }}
          path: package-lock.json
          retention-days: 1

      - name: Validate Prisma schema
        run: npx prisma validate

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Lint
        run: npm run lint

      - name: Tests
        run: npm test

      - name: TypeScript
        run: npx tsc --noEmit

      - name: Next.js build
        run: npm run build

      - name: Commit regenerated package lock
        if: github.event_name == 'push' && github.actor != 'github-actions[bot]'
        run: |
          if git diff --quiet -- package-lock.json; then
            echo "package-lock.json is already current."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          git commit -m "chore: sync package lock"
          git push origin HEAD:${GITHUB_REF_NAME}
