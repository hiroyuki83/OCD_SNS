name: Security integration CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

concurrency:
  group: security-integration-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/coco_ci
      NEXTAUTH_SECRET: ci-only-placeholder-secret-not-used-in-production
      AUTH_SECRET: ci-only-placeholder-secret-not-used-in-production
      STAFF_MFA_ENCRYPTION_KEY: AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Use Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Validate Prisma schema
        run: npx prisma validate

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Lint
        run: npm run lint

      - name: Tests
        run: npm test

      - name: TypeScript
        run: npx tsc --noEmit

      - name: Next.js build
        run: npm run build
