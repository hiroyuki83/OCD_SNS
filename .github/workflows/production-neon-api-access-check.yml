name: Production Neon API Access Check

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: coco-production-neon-api-access-check
  cancel-in-progress: true

jobs:
  verify-neon-api-access:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      NEON_API_KEY: ${{ secrets.NEON_API_KEY }}
      PROJECT_ID: withered-lab-08522436

    steps:
      - name: Verify Neon API authentication
        shell: bash
        run: |
          set -euo pipefail

          [ -n "${NEON_API_KEY:-}" ] || {
            echo "NEON_API_KEY is not configured."
            exit 1
          }

          auth_json="$(curl --fail-with-body --silent --show-error             --request GET             --url "https://console.neon.tech/api/v2/auth"             --header "Accept: application/json"             --header "Authorization: Bearer ${NEON_API_KEY}")"

          credential_type="$(jq -r '.auth_method // .credential_type // .type // "unknown"' <<<"${auth_json}")"
          echo "Neon API authentication succeeded."
          echo "credential_type=${credential_type}"

      - name: Verify Production project branch read access
        id: project_access
        shell: bash
        run: |
          set -euo pipefail

          response="$(curl --fail-with-body --silent --show-error             --request GET             --url "https://console.neon.tech/api/v2/projects/${PROJECT_ID}/branches?limit=10000&include_deleted=false"             --header "Accept: application/json"             --header "Authorization: Bearer ${NEON_API_KEY}")"

          branch_count="$(jq '.branches | length' <<<"${response}")"
          default_id="$(jq -r '.branches[] | select(.default == true) | .id' <<<"${response}" | head -n1)"
          default_name="$(jq -r '.branches[] | select(.default == true) | .name' <<<"${response}" | head -n1)"

          [ "${branch_count}" -gt 0 ] || {
            echo "Production project returned no active branches."
            exit 1
          }

          [ -n "${default_id}" ] && [ "${default_id}" != "null" ] || {
            echo "Production default branch could not be resolved."
            exit 1
          }

          echo "branch_count=${branch_count}" >> "${GITHUB_OUTPUT}"
          echo "default_id=${default_id}" >> "${GITHUB_OUTPUT}"
          echo "default_name=${default_name}" >> "${GITHUB_OUTPUT}"

      - name: Emit Neon API access summary
        shell: bash
        env:
          BRANCH_COUNT: ${{ steps.project_access.outputs.branch_count }}
          DEFAULT_BRANCH_ID: ${{ steps.project_access.outputs.default_id }}
          DEFAULT_BRANCH_NAME: ${{ steps.project_access.outputs.default_name }}
        run: |
          {
            echo "## Production Neon API access: PASS"
            echo
            echo "- project: \`${PROJECT_ID}\`"
            echo "- active branches visible: \`${BRANCH_COUNT}\`"
            echo "- default branch ID: \`${DEFAULT_BRANCH_ID}\`"
            echo "- default branch name: \`${DEFAULT_BRANCH_NAME}\`"
            echo
            echo "This workflow is read-only. It performs GET requests only."
          } >> "${GITHUB_STEP_SUMMARY}"
